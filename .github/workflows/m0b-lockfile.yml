name: M0-B lockfile and browser verification
on:
  push:
    branches: [dev]
    paths: [.github/workflows/m0b-lockfile.yml]
permissions:
  contents: read
jobs:
  bootstrap:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Generate first lockfile for exact direct dependencies
        run: |
          set -euo pipefail
          npm install --global pnpm@10.11.1
          test ! -f pnpm-lock.yaml
          node --input-type=module -e "import fs from 'node:fs';const p=JSON.parse(fs.readFileSync('package.json'));for(const v of Object.values({...p.dependencies,...p.devDependencies}))if(!/^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$/.test(v))throw Error('Unpinned dependency');"
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile
      - name: Commit only the generated lockfile to dev without overwriting changes
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'build(m0-b): pin registry-resolved dependency lockfile'
          git push origin HEAD:dev
          git archive --format=tar HEAD > source.tar
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm deploy:dry-run
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: foundation-bootstrap
          path: |
            source.tar
            pnpm-lock.yaml
            artifacts/screenshots
            playwright-report
            test-results
            dist/build.json
          retention-days: 2
