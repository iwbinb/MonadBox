name: M0-B toolchain preparation
on:
  push:
    branches: [dev]
    paths: [.github/workflows/m0b-toolchain.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Resolve once, pin exact versions, archive toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@10.11.1
          git archive --format=tar HEAD > baseline.tar
          mkdir toolchain
          cd toolchain
          printf '%s\n' '{"name":"monadbox","version":"0.1.0","private":true,"type":"module","packageManager":"pnpm@10.11.1","engines":{"node":">=22.16.0 <23"}}' > package.json
          printf '%s\n' 'onlyBuiltDependencies:' '  - esbuild' '  - workerd' > pnpm-workspace.yaml
          pnpm add --save-exact react@19 react-dom@19 react-router-dom@7 hono@4 zod@4
          pnpm add --save-dev --save-exact typescript@5.9 vite@7 @types/react@19 @types/react-dom@19 @types/node@22 @cloudflare/workers-types wrangler@4.135.0 vitest@3.2 @playwright/test miniflare esbuild prettier eslint@9 @eslint/js@9 typescript-eslint@8 eslint-plugin-react-hooks
          pnpm exec wrangler --version
          pnpm exec wrangler preview --help
          cat package.json
          cd ..
          tar -czf toolchain.tar.gz -C toolchain node_modules package.json pnpm-lock.yaml pnpm-workspace.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m0b-toolchain
          path: |
            toolchain.tar.gz
            baseline.tar
          retention-days: 2
