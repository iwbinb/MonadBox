name: MonadBox CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install pinned package manager and frozen dependencies
        run: |
          npm install --global pnpm@10.11.1
          pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Install pinned native test tools
        run: bash scripts/install-test-tools.sh
      - run: pnpm test:contracts
      - run: pnpm test:chain-local
      - name: Validate deployment without publishing
        run: pnpm deploy:dry-run
      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/screenshots
            playwright-report
            test-results
            dist/build.json
            artifacts/local-chain.json
            artifacts/group-local-chain.json
          if-no-files-found: ignore
          retention-days: 7
