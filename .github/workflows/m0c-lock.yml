name: M0-C lockfile and verification
on:
  push:
    branches: [dev]
    paths: [.github/workflows/m0c-lock.yml]
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Generate pinned lockfile and format the authored source
        run: |
          set -euo pipefail
          npm install --global pnpm@10.11.1
          node --input-type=module -e "import fs from 'node:fs';const p=JSON.parse(fs.readFileSync('package.json'));for(const v of Object.values({...p.dependencies,...p.devDependencies}))if(!/^[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?$/.test(v))throw Error('Unpinned dependency');"
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile
          pnpm format
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml package.json src tests scripts '*.ts' '*.mjs' '*.json' '*.jsonc' '*.html' .github/workflows
          git commit -m 'build(m0-c): lock exact dependencies and normalize source formatting'
          git push origin HEAD:dev
          git archive --format=tar HEAD > source.tar
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: bash scripts/install-test-tools.sh
      - run: pnpm test:contracts
      - run: pnpm test:chain-local
      - run: pnpm deploy:dry-run
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m0c-verification
          path: |
            source.tar
            artifacts/screenshots
            artifacts/local-chain.json
            playwright-report
            test-results
            dist/build.json
          retention-days: 3
